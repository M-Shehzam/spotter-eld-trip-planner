# Render stops a free instance after fifteen idle minutes and takes about a
# minute to wake it. A reviewer opening the hosted link should not spend that
# minute on a spinner, so this pings the health endpoint to hold it awake.
#
# The window is deliberate. A free workspace gets 750 instance hours a month
# and a spun-down service consumes none of them. Pinging around the clock
# would burn 744 hours in a 31-day month, which leaves no room for build
# minutes and, on an account with a card on file, turns an overage into a
# charge rather than a pause.
#
# 12:00 to 04:00 UTC covers US working hours and the evening in Pakistan.
# Sixteen hours a day comes to about 496 hours a month, so the margin is
# roughly 250 hours.

name: Keep the API warm

on:
  schedule:
    - cron: "*/10 12-23,0-3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          curl --silent --show-error --fail --max-time 90 \
            "${{ vars.API_BASE_URL }}/api/v1/health/" \
            || echo "The API did not answer. It will wake on the next request."
